# ABGS Configuration for Defense Acquisition System Benchmark
# Domain: Federal Defense Acquisition
# Focus: DAS phases, FAR/DFARS, Adaptive Acquisition Framework, contract types
# Benchmark Type: Evaluation of LLM understanding of acquisition policy and decision-making

name: "Defense Acquisition System (DAS) Comprehensive Benchmark"
category: "government_acquisition"

# Ingestion Configuration
ingestion:
  pdf_fallback: "pypdf_only"
  pymupdf_short_page_chars: 20

# Generation Configuration
generation:
  prompt_version: "v1"
  provider: "deterministic"
  model_name: "template_generator"
  seed: 42
  target_questions_per_chunk: 2
  minimum_multi_chunk_ratio: 0.4
  max_questions: 400
  temperature: 0.2

# Quality Configuration
quality:
  duplicate_similarity_threshold: 0.92
  review_confidence_threshold: 0.75
  multi_chunk_target: 0.4
  multi_chunk_warning: 0.25
  validation_pass_target_min: 0.6
  validation_pass_target_max: 0.85
  validation_pass_warning: 0.5
  answer_support_target: 0.8
  answer_support_warning: 0.6

# Chunking Configuration
chunking:
  strategy_id: "sentence_window"
  version: "1.0"
  target_tokens: 120
  overlap_tokens: 20
  tokenizer: "whitespace_v1"
  normalization_rules:
    - "trim_whitespace"
    - "collapse_internal_whitespace"
    - "normalize_newlines"

# Evaluation Configuration
evaluation:
  models:
    - "oracle"
    - "extractive_baseline"
  max_cost_usd: null
  max_tokens_total: null
  critic_model: null
